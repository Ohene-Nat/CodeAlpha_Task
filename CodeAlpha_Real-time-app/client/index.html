<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signal — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="brand-row">
        <span class="brand-mark"></span>
        <span class="brand-name">Signal</span>
      </div>

      <div id="login-view">
        <h1>Welcome back</h1>
        <p class="lede">Sign in to join or start a room.</p>
        <div id="login-error" class="form-error"></div>
        <form id="login-form">
          <div class="field">
            <label for="login-email">Email</label>
            <input id="login-email" type="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input id="login-password" type="password" autocomplete="current-password" required />
          </div>
          <button class="btn" type="submit" id="login-submit">Sign in</button>
        </form>
        <div class="switch-row">
          No account yet? <button type="button" id="show-register">Create one</button>
        </div>
      </div>

      <div id="register-view" class="hidden">
        <h1>Create your account</h1>
        <p class="lede">Takes about ten seconds.</p>
        <div id="register-error" class="form-error"></div>
        <form id="register-form">
          <div class="field">
            <label for="register-name">Name</label>
            <input id="register-name" type="text" autocomplete="name" required />
          </div>
          <div class="field">
            <label for="register-email">Email</label>
            <input id="register-email" type="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="register-password">Password</label>
            <input id="register-password" type="password" autocomplete="new-password" minlength="8" required />
            <div style="margin-top:6px; font-size:11px; color:var(--text-dim);">At least 8 characters.</div>
          </div>
          <button class="btn" type="submit" id="register-submit">Create account</button>
        </form>
        <div class="switch-row">
          Already have an account? <button type="button" id="show-login">Sign in</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
